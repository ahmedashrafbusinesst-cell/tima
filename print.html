<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>طباعة الإيصال</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 16px;
        color: #1c2b3a;
      }
      .card {
        background: #fff;
        border: 1px solid #dde3ea;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 17px;
        margin: 0 0 10px;
        color: #0f2c4c;
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        font-size: 14px;
        gap: 8px;
      }
      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 20px;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }
      .b-sale {
        background: #0f2c4c;
      }
      .b-col {
        background: #b9770e;
      }
      .b-stock {
        background: #1e8449;
      }
      .big {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 10px;
        background: #c8a24a;
        color: #1c2b3a;
        font-size: 18px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      .big:disabled {
        opacity: 0.6;
      }
      .sec {
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 8px;
        background: #0f2c4c;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        margin-top: 8px;
      }
      .sec.gray {
        background: #6b7c8f;
      }
      #status {
        margin-top: 12px;
        padding: 12px;
        border-radius: 8px;
        background: #eef2f7;
        font-size: 15px;
        font-weight: 600;
        min-height: 44px;
        word-break: break-word;
      }
      #status.ok {
        background: #eafaf1;
        color: #1e8449;
      }
      #status.err {
        background: #fdecea;
        color: #c0392b;
      }
      input,
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #dde3ea;
        border-radius: 6px;
        font-size: 16px;
        margin-top: 6px;
        font-family: inherit;
      }
      #pbar {
        display: none;
        height: 16px;
        background: #e3e8ef;
        border-radius: 8px;
        overflow: hidden;
        margin-top: 10px;
      }
      #pfill {
        height: 100%;
        width: 0;
        background: #c8a24a;
        border-radius: 8px;
        transition: width 0.15s;
      }
      #pbar.done #pfill {
        background: #1e8449;
      }
      small {
        color: #6b7c8f;
      }
      details {
        margin-top: 10px;
        font-size: 13px;
      }
      hr.dash {
        border: 0;
        border-top: 1px dashed #dde3ea;
        margin: 8px 0;
      }
      @media (max-width: 480px) {
        body {
          padding: 10px;
        }
        .big {
          font-size: 16px;
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🖨 طباعة الإيصال</h1>
      <div id="summary"></div>
    </div>
    <div class="card" id="previewWrap" style="display: none">
      <h1>معاينة الورقة اللي هتتطبع</h1>
      <div
        id="logoInfo"
        style="font-size: 13px; margin-bottom: 8px; font-weight: 600"
      ></div>
      <img
        id="preview"
        alt="معاينة"
        style="
          width: 100%;
          border: 1px solid #dde3ea;
          background: #fff;
          image-rendering: auto;
        "
      />
    </div>
    <div class="card">
      <label style="font-size: 14px; font-weight: 600">عرض ورق الطابعة</label>
      <select id="paper" onchange="onPaper()">
        <option value="576">80 مم (الورق العريض)</option>
        <option value="384">58 مم (الورق الصغير)</option>
      </select>
      <small
        >لازم يكون نفس عرض الورق المضبوط في RawBT. لو الطباعة مقصوصة أو مشوشة،
        غيّر العرض وجرّب تاني.</small
      >
    </div>
    <button class="big" id="goBtn" onclick="run()">🖨 اتصال وطباعة</button>
    <button class="sec" onclick="closeMe()">↩ رجوع للنظام</button>
    <div class="card" id="statusCard" style="margin-top: 12px">
      <div id="status" style="margin-top: 0">
        جاهز. اضغط "اتصال وطباعة" فوق.
      </div>
      <div id="pbar"><div id="pfill"></div></div>
    </div>
    <details>
      <summary>إعدادات متقدمة</summary>
      <div style="margin-top: 8px">
        <label>Service UUID إضافي (اختياري)</label>
        <input
          id="extraSvc"
          placeholder="مثال: 0000ff00-0000-1000-8000-00805f9b34fb"
          dir="ltr"
        />
        <label style="margin-top: 8px; display: block">
          <input type="checkbox" id="allDev" style="width: auto" checked />
          اعرض كل أجهزة البلوتوث (لو الطابعة مش ظاهرة)
        </label>
        <small style="display: block; margin-top: 10px">
          للطوارئ فقط: الطباعة ثابتة على قناة واحدة. الزرار ده بيجرّب قناة تانية
          مرة واحدة.
        </small>
        <button
          class="sec gray"
          id="altBtn"
          style="display: none"
          onclick="altChannel()"
        >
          قناة بديلة ثم اطبع تاني
        </button>
        <hr class="dash" />
        <b>لوحة التجارب (بلوتوث مباشر)</b>
        <label style="display: block; margin-top: 8px">القناة</label>
        <select id="chSel" onchange="onCh()"></select>
        <label style="display: block; margin-top: 8px">طريقة الكتابة</label>
        <select id="modeSel" onchange="saveCfg()">
          <option value="auto">تلقائي</option>
          <option value="resp">مع تأكيد (Write)</option>
          <option value="noresp">من غير تأكيد (Write Without Response)</option>
        </select>
        <label style="display: block; margin-top: 8px">حجم الحزمة (بايت)</label>
        <input
          id="ckIn"
          type="number"
          inputmode="numeric"
          dir="ltr"
          onchange="saveCfg()"
        />
        <label style="display: block; margin-top: 8px"
          >الانتظار بين الحزم (مللي ثانية)</label
        >
        <input
          id="dlIn"
          type="number"
          inputmode="numeric"
          dir="ltr"
          onchange="saveCfg()"
        />
        <label style="display: block; margin-top: 8px">عدد أسطر الشريحة</label>
        <input
          id="rowIn"
          type="number"
          inputmode="numeric"
          dir="ltr"
          onchange="saveCfg()"
        />
        <label style="display: block; margin-top: 8px"
          >استراحة بين الشرايح (مللي ثانية)</label
        >
        <input
          id="spIn"
          type="number"
          inputmode="numeric"
          dir="ltr"
          onchange="saveCfg()"
        />
        <button class="sec" onclick="runBluetooth()">
          🖨 اطبع بالإعدادات دي (بلوتوث مباشر)
        </button>
      </div>
    </details>
    <script>
      const NAME_PREFIX = 'XP';
      const FIXED_CHANNEL = 1;
      const IS_ANDROID = /Android/i.test(navigator.userAgent);
      const CH_KEY = 'tima2_ch_' + (IS_ANDROID ? 'and' : 'oth');
      const CONTACTS = [
        ['المبيعات:', '01111174321'],
        ['الحسابات:', '01009988660'],
        ['الشكاوى والمقترحات:', '01208882121'],
      ];
      // ---------- إعدادات الإرسال (بتتغيّر من لوحة التجارب وبتتحفظ) ----------
      // أندرويد: حزم صغيرة + تأخير أكبر + شرائح صورة أصغر عشان متتلخبطش
      const PREF = 'tima4_' + (IS_ANDROID ? 'and' : 'oth') + '_';
      const DEF = IS_ANDROID
        ? { mode: 'noresp', ck: 20, dl: 35, rows: 24, sp: 80 }
        : { mode: 'auto', ck: 100, dl: 10, rows: 128, sp: 0 };
      const FONT = 'Tahoma, "Geeza Pro", Arial, sans-serif';
      const SERVICES = [
        '000018f0-0000-1000-8000-00805f9b34fb',
        '0000ff00-0000-1000-8000-00805f9b34fb',
        '0000ff12-0000-1000-8000-00805f9b34fb',
        '0000ffe0-0000-1000-8000-00805f9b34fb',
        '0000ffe5-0000-1000-8000-00805f9b34fb',
        '0000fff0-0000-1000-8000-00805f9b34fb',
        '0000ae30-0000-1000-8000-00805f9b34fb',
        '0000fee7-0000-1000-8000-00805f9b34fb',
        'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
        '49535343-fe7d-4ae5-8fa9-9fafd205e455',
        '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
      ];
      let R = null,
        device = null,
        chars = [],
        idx = 0,
        PERF = {};
      const $ = (id) => document.getElementById(id);
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      function st(t, cls) {
        const e = $('status');
        if (!cls) e.dataset.stage = t;
        e.textContent = t;
        e.className = cls || '';
      }
      function prog(p, done) {
        const b = $('pbar');
        b.style.display = p == null ? 'none' : 'block';
        b.className = done ? 'done' : '';
        $('pfill').style.width = (p || 0) + '%';
      }
      function ls(k, v) {
        try {
          if (v === undefined) return localStorage.getItem(k);
          localStorage.setItem(k, v);
        } catch (e) {}
      }
      function withTimeout(p, ms, label) {
        return Promise.race([
          p,
          new Promise((_, rej) =>
            setTimeout(
              () => rej(new Error('انتهى الوقت في مرحلة: ' + label)),
              ms,
            ),
          ),
        ]);
      }
      function closeMe() {
        try {
          window.close();
        } catch (e) {}
        setTimeout(() => {
          if (history.length > 1) history.back();
        }, 300);
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );
      }
      function num(v) {
        return (Math.round((Number(v) || 0) * 100) / 100).toLocaleString(
          'en-US',
        );
      }
      function receiptKind(r) {
        if (!r) return 'sale';
        if (r.type === 'collection' || r.type === 'col') return 'collection';
        if (r.type === 'stock' || r.type === 'جرد') return 'stock';
        return 'sale';
      }

      // ---------- قراءة بيانات الإيصال من اللينك ----------
      (function init() {
        try {
          const m = location.hash.match(/d=([^&]+)/);
          if (!m) throw new Error('مفيش بيانات إيصال في اللينك');
          let b = m[1].replace(/-/g, '+').replace(/_/g, '/');
          while (b.length % 4) b += '=';
          const bin = atob(b);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          R = JSON.parse(new TextDecoder().decode(bytes));
          $('summary').innerHTML = buildSummaryHtml(R);
        } catch (e) {
          st(
            'اللينك مش سليم: ' + e.message + ' — ارجع للنظام واضغط طباعة تاني.',
            'err',
          );
          $('goBtn').disabled = true;
        }
        const saved = ls('tima_svc');
        if (saved) $('extraSvc').value = saved;
      })();

      function buildSummaryHtml(r) {
        const kind = receiptKind(r);
        if (kind === 'stock') return summaryStock(r);
        if (kind === 'collection') return summaryCollection(r);
        return summarySale(r);
      }

      function summarySale(r) {
        const itemsHtml = (r.items || [])
          .map(
            (it, i) =>
              '<div class="row" style="font-size:13px"><span>' +
              (i + 1) +
              '. ' +
              (it.isBonus ? '[بونص] ' : '') +
              esc(String(it.name || '').replace(/^بونص\s*[—-]\s*/, '')) +
              (it.color ? ' (' + esc(it.color) + ')' : '') +
              '</span><b>' +
              esc(it.qty) +
              ' ' +
              esc(it.unit || '') +
              (it.isBonus
                ? ''
                : ' × ' + esc(it.price) + ' = ' + esc(it.total)) +
              '</b></div>',
          )
          .join('');
        return (
          '<div class="row"><span><span class="badge b-sale">مبيعات</span></span><b>#' +
          esc(r.number) +
          '</b></div>' +
          '<div class="row"><span>التاريخ</span><b>' +
          esc(r.date) +
          '</b></div>' +
          '<div class="row"><span>العميل</span><b>' +
          esc(r.customer) +
          '</b></div>' +
          '<div class="row"><span>المندوب</span><b>' +
          esc(r.employee) +
          '</b></div>' +
          '<hr class="dash">' +
          itemsHtml +
          '<hr class="dash">' +
          '<div class="row"><span>الإجمالي</span><b>' +
          esc(r.net) +
          ' ج</b></div>'
        );
      }

      function summaryCollection(r) {
        return (
          '<div class="row"><span><span class="badge b-col">تحصيل</span></span><b>#' +
          esc(r.number) +
          '</b></div>' +
          '<div class="row"><span>التاريخ</span><b>' +
          esc(r.date) +
          '</b></div>' +
          '<div class="row"><span>العميل</span><b>' +
          esc(r.customer) +
          '</b></div>' +
          '<div class="row"><span>المندوب</span><b>' +
          esc(r.employee) +
          '</b></div>' +
          '<hr class="dash">' +
          '<div class="row"><span>المحصّل</span><b>' +
          esc(r.net) +
          ' ج</b></div>' +
          (r.receivedFrom
            ? '<div class="row"><span>من</span><b>' +
              esc(r.receivedFrom) +
              '</b></div>'
            : '')
        );
      }

      function summaryStock(r) {
        const items = r.items || [];
        const methods = r.methods || {};
        const s = r.salesSummary || {};
        const itemsHtml = items
          .map(
            (it) =>
              '<div class="row" style="font-size:13px"><span>' +
              esc(it.name) +
              (it.color ? ' (' + esc(it.color) + ')' : '') +
              '</span><b>مبيع ' +
              esc(it.sold || 0) +
              ' | متبقي ' +
              esc(it.balance != null ? it.balance : it.qty) +
              '</b></div>',
          )
          .join('');
        const methodsHtml = Object.keys(methods)
          .filter((k) => methods[k] > 0)
          .map(
            (k) =>
              '<div class="row"><span>' +
              esc(k) +
              '</span><b>' +
              num(methods[k]) +
              ' ج</b></div>',
          )
          .join('');
        return (
          '<div class="row"><span><span class="badge b-stock">جرد عربية</span></span><b>' +
          esc(r.rep || '') +
          '</b></div>' +
          '<div class="row"><span>التاريخ</span><b>' +
          esc(r.date) +
          '</b></div>' +
          '<hr class="dash">' +
          (itemsHtml || '<div class="row"><span>لا توجد أصناف</span></div>') +
          '<hr class="dash">' +
          '<div class="row"><span>مبيعات</span><b>' +
          num(s.salesTotal) +
          ' ج</b></div>' +
          '<div class="row"><span>محصّل</span><b>' +
          num(s.paid) +
          ' ج</b></div>' +
          '<div class="row"><span>تحصيلات</span><b>' +
          num(s.collections) +
          ' ج</b></div>' +
          '<div class="row"><span>إجمالي نقدية</span><b>' +
          num(s.cashTotal) +
          ' ج</b></div>' +
          (methodsHtml ? '<hr class="dash">' + methodsHtml : '')
        );
      }

      // ---------- البلوتوث ----------
      function score(c) {
        const u = (c.service && c.service.uuid) || '';
        if (u.indexOf('000018f0') === 0) return 0;
        if (u.indexOf('e7810a71') === 0) return 1;
        if (u.indexOf('49535343') === 0) return 2;
        return 3;
      }
      function loadCfg() {
        const g = (k) => {
          const v = ls(PREF + k);
          return v == null || v === '' ? DEF[k] : v;
        };
        $('modeSel').value = g('mode');
        $('ckIn').value = g('ck');
        $('dlIn').value = g('dl');
        $('rowIn').value = g('rows');
        $('spIn').value = g('sp');
      }
      function saveCfg() {
        ls(PREF + 'mode', $('modeSel').value);
        ls(PREF + 'ck', $('ckIn').value);
        ls(PREF + 'dl', $('dlIn').value);
        ls(PREF + 'rows', $('rowIn').value);
        ls(PREF + 'sp', $('spIn').value);
      }
      function cfg() {
        const n = (id, d, lo, hi) => {
          const v = parseInt($(id).value, 10);
          return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d;
        };
        return {
          mode: $('modeSel').value,
          ck: n('ckIn', DEF.ck, 1, 512),
          dl: n('dlIn', DEF.dl, 0, 1000),
          rows: n('rowIn', DEF.rows, 8, 255),
          sp: n('spIn', DEF.sp, 0, 5000),
        };
      }
      function shortUuid(u) {
        u = String(u || '');
        return u.indexOf('0000') === 0 &&
          u.slice(8) === '-0000-1000-8000-00805f9b34fb'
          ? u.slice(4, 8)
          : u.slice(0, 8);
      }
      function fillCh() {
        const sel = $('chSel');
        sel.innerHTML = '';
        chars.forEach((c, i) => {
          const p = [];
          if (c.properties.write) p.push('W');
          if (c.properties.writeWithoutResponse) p.push('WNR');
          const o = document.createElement('option');
          o.value = i;
          o.textContent =
            i +
            1 +
            ') ' +
            shortUuid(c.service && c.service.uuid) +
            ' / ' +
            shortUuid(c.uuid) +
            ' [' +
            p.join('+') +
            ']';
          sel.appendChild(o);
        });
        sel.value = idx;
      }
      function onCh() {
        const v = parseInt($('chSel').value, 10);
        if (v >= 0 && v < chars.length) idx = v;
      }
      function ready() {
        return !!(
          device &&
          device.gatt &&
          device.gatt.connected &&
          chars.length
        );
      }
      async function openGatt() {
        try {
          st('2/4 جاري الاتصال بالطابعة...');
          const server = await withTimeout(
            device.gatt.connect(),
            20000,
            'الاتصال بالطابعة',
          );
          st('3/4 جاري قراءة الخدمات...');
          const svcs = await withTimeout(
            server.getPrimaryServices(),
            20000,
            'قراءة الخدمات',
          );
          st('4/4 جاري تجهيز قناة الكتابة...');
          chars = [];
          for (const s of svcs) {
            const cs = await withTimeout(
              s.getCharacteristics(),
              20000,
              'قراءة القنوات',
            );
            cs.forEach((c) => {
              if (c.properties.write || c.properties.writeWithoutResponse)
                chars.push(c);
            });
          }
          if (!chars.length) {
            throw new Error(
              'الطابعة اتصلت بس مفيش قناة كتابة. افتح الإعدادات المتقدمة.',
            );
          }
          chars.sort((a, b) => score(a) - score(b));
          const savedCh = parseInt(ls(CH_KEY), 10);
          idx =
            savedCh >= 0 && savedCh < chars.length
              ? savedCh
              : FIXED_CHANNEL < chars.length
                ? FIXED_CHANNEL
                : 0;
          fillCh();
          $('altBtn').style.display = chars.length > 1 ? '' : 'none';
        } catch (e) {
          try {
            device.gatt.disconnect();
          } catch (x) {}
          throw e;
        }
      }
      async function requestWithFallback(extra) {
        const full = SERVICES.concat(extra ? [extra.toLowerCase()] : []);
        const short = [
          '000018f0-0000-1000-8000-00805f9b34fb',
          '0000ffe0-0000-1000-8000-00805f9b34fb',
          '49535343-fe7d-4ae5-8fa9-9fafd205e455',
        ];
        const attempts = [];
        if (!$('allDev').checked) {
          attempts.push({
            label: 'بالاسم XP',
            opts: {
              filters: [{ namePrefix: NAME_PREFIX }],
              optionalServices: full,
            },
          });
        }
        attempts.push({
          label: 'قايمة كاملة',
          opts: { acceptAllDevices: true, optionalServices: full },
        });
        attempts.push({
          label: 'قايمة مختصرة',
          opts: { acceptAllDevices: true, optionalServices: short },
        });
        attempts.push({
          label: 'من غير خدمات',
          opts: { acceptAllDevices: true },
        });
        let lastErr;
        const tried = [];
        for (const a of attempts) {
          try {
            st('1/4 اختار الطابعة من القايمة... (' + a.label + ')');
            return await navigator.bluetooth.requestDevice(a.opts);
          } catch (e) {
            lastErr = e;
            tried.push(a.label + ': ' + errText(e));
            if (e && e.name === 'NotFoundError') throw e;
          }
        }
        const err = new Error('فشلت كل الطرق → ' + tried.join(' || '));
        err.name = (lastErr && lastErr.name) || 'Error';
        throw err;
      }
      async function connectFlow() {
        if (!navigator.bluetooth) {
          throw new Error(
            'المتصفح مش بيدعم البلوتوث — افتح الصفحة من تطبيق Bluefy',
          );
        }
        if (device) {
          try {
            await openGatt();
            return;
          } catch (e) {
            device = null;
          }
        }
        const extra = $('extraSvc').value.trim();
        ls('tima_svc', extra);
        device = await requestWithFallback(extra);
        device.addEventListener('gattserverdisconnected', () => {
          chars = [];
        });
        await openGatt();
      }

      // كتابة شريحة واحدة على الطابعة (base/total لحساب نسبة التقدم الكلية)
      async function write(bytes, base, total) {
        base = base || 0;
        total = total || bytes.length;
        const C = cfg();
        const c = chars[idx];
        const canNoResp =
          !!c.properties.writeWithoutResponse && !!c.writeValueWithoutResponse;
        const canResp = !!c.properties.write;
        let useNoResp;
        if (C.mode === 'noresp' && canNoResp) useNoResp = true;
        else if (C.mode === 'resp' && canResp) useNoResp = false;
        else useNoResp = !canResp && canNoResp;
        let ck = C.ck;
        let pos = 0;
        while (pos < bytes.length) {
          const part = bytes.slice(pos, pos + ck);
          try {
            if (useNoResp) await c.writeValueWithoutResponse(part);
            else if (c.writeValueWithResponse)
              await c.writeValueWithResponse(part);
            else await c.writeValue(part);
            pos += part.length;
            const pc = Math.round(((base + pos) * 100) / total);
            prog(pc);
            st('جاري الطباعة... ' + pc + '%');
            if (C.dl) await sleep(C.dl);
          } catch (e) {
            if (ck > 20) {
              ck = 20;
              continue;
            }
            if (useNoResp && canResp) {
              useNoResp = false;
              continue;
            }
            throw e;
          }
        }
      }

      // ---------- شعار ----------
      let LOGO_INFO = 'الشعار: بيدور على الملف...';
      const LOGO_NAMES = [
        'logo.png',
        'logo.jpg',
        'logo.jpeg',
        'logo.webp',
        'Logo.png',
        'Logo.jpg',
      ];
      const logoPromise = (async function () {
        for (const n of LOGO_NAMES) {
          const im = await new Promise((res) => {
            const i = new Image();
            i.onload = () => res(i);
            i.onerror = () => res(null);
            i.src = n + '?t=' + Date.now();
          });
          if (im && im.width) {
            LOGO_INFO = '✔ الشعار اتحمّل (' + n + ')';
            return im;
          }
        }
        LOGO_INFO = '✖ الشعار مش موجود: ارفع logo.png جنب print.html';
        return null;
      })();

      // ---------- رسم الإيصال (3 أنواع منفصلة) ----------
      function render(r, logo) {
        const kind = receiptKind(r);
        if (kind === 'stock') return renderStock(r, logo);
        if (kind === 'collection') return renderCollection(r, logo);
        return renderSale(r, logo);
      }

      function makeCanvas(extraH) {
        const W = Number($('paper').value) || 576;
        const M = 12;
        const cv = document.createElement('canvas');
        cv.width = W;
        cv.height = Math.max(1200, extraH || 1600);
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = '#000';
        ctx.textBaseline = 'top';
        try {
          ctx.direction = 'rtl';
        } catch (e) {}
        return { W, M, cv, ctx, y: 8 };
      }
      function finishCanvas(state) {
        const { W, cv, ctx, y } = state;
        const H = Math.min(Math.ceil(y + 20), cv.height);
        const out = document.createElement('canvas');
        out.width = W;
        out.height = H;
        out.getContext('2d').drawImage(cv, 0, 0);
        return {
          data: ctx.getImageData(0, 0, W, H).data,
          W,
          H,
          url: out.toDataURL('image/png'),
        };
      }
      function drawHelpers(state) {
        const { W, M, ctx } = state;
        const FSI = '\u2068',
          LRI = '\u2066',
          PDI = '\u2069';
        const iso = (v) => FSI + String(v == null ? '' : v) + PDI;
        const font = (s, b) => {
          ctx.font = (b === false ? '' : 'bold ') + s + 'px ' + FONT;
        };
        function wrap(t, maxW) {
          const words = String(t == null ? '' : t).split(/\s+/);
          const lines = [];
          let cur = '';
          words.forEach((w) => {
            const test = cur ? cur + ' ' + w : w;
            if (ctx.measureText(test).width > maxW && cur) {
              lines.push(cur);
              cur = w;
            } else cur = test;
          });
          if (cur) lines.push(cur);
          return lines;
        }
        function center(t, s, b) {
          font(s, b);
          ctx.textAlign = 'center';
          wrap(t, W - 2 * M).forEach((l) => {
            ctx.fillText(l, W / 2, state.y);
            state.y += s + 10;
          });
        }
        function right(t, s, b) {
          font(s, b);
          ctx.textAlign = 'right';
          wrap(t, W - 2 * M).forEach((l) => {
            ctx.fillText(l, W - M, state.y);
            state.y += s + 10;
          });
        }
        function row(label, val, s, b) {
          font(s, b);
          ctx.textAlign = 'right';
          ctx.fillText(label, W - M, state.y);
          ctx.textAlign = 'left';
          ctx.fillText(val, M, state.y);
          state.y += s + 10;
        }
        function gap(n) {
          state.y += n;
        }
        function line(kind) {
          ctx.save();
          ctx.strokeStyle = '#000';
          if (kind === 'solid') ctx.lineWidth = 3;
          else if (kind === 'dashed') {
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 6]);
          } else {
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 5]);
          }
          ctx.beginPath();
          ctx.moveTo(M, state.y + 4);
          ctx.lineTo(W - M, state.y + 4);
          ctx.stroke();
          ctx.restore();
          state.y += 16;
        }
        function bar(t, s) {
          ctx.fillRect(M, state.y, W - 2 * M, s + 16);
          ctx.fillStyle = '#fff';
          font(s, true);
          ctx.textAlign = 'center';
          ctx.fillText(t, W / 2, state.y + 7);
          ctx.fillStyle = '#000';
          state.y += s + 28;
        }
        function drawLogo(logo) {
          if (!(logo && logo.width)) return;
          const maxW = 280,
            maxH = 130;
          const k = Math.min(maxW / logo.width, maxH / logo.height, 1.5);
          const w = Math.round(logo.width * k),
            h = Math.round(logo.height * k);
          ctx.drawImage(logo, Math.round((W - w) / 2), state.y, w, h);
          state.y += h + 10;
        }
        function contacts() {
          gap(4);
          line('dashed');
          center('للتواصل معنا', 24, true);
          gap(2);
          CONTACTS.forEach((c) => row(c[0], c[1], 23, false));
        }
        return {
          iso,
          center,
          right,
          row,
          gap,
          line,
          bar,
          drawLogo,
          contacts,
          num,
        };
      }

      function renderSale(r, logo) {
        const items = r.items || [];
        const state = makeCanvas(
          1600 + items.length * 320 + (r.payments || []).length * 70,
        );
        const h = drawHelpers(state);
        h.drawLogo(logo);
        h.center(r.company || '', 28, true);
        h.gap(6);
        h.bar('فاتورة مبيعات', 28);
        h.row('رقم الفاتورة:', '#' + r.number, 28, true);
        h.row('التاريخ:', h.iso(r.date), 24, false);
        h.gap(2);
        h.line('dashed');
        h.right('العميل: ' + h.iso(r.customer), 28, true);
        const place = [r.gov, r.address].filter(Boolean).join(' - ');
        if (r.phone) h.right('الهاتف: ' + h.iso(r.phone), 24, false);
        if (place) h.right('العنوان: ' + h.iso(place), 22, false);
        h.right('المندوب: ' + h.iso(r.employee), 24, false);
        h.gap(2);
        h.line('dashed');
        items.forEach((it, i) => {
          const name = String(it.name || '').replace(/^بونص\s*[—-]\s*/, '');
          h.right(
            h.iso(i + 1 + '.') +
              ' ' +
              (it.isBonus ? h.iso('[بونص]') + ' ' : '') +
              h.iso(name) +
              (it.color ? ' ' + h.iso('(' + it.color + ')') : ''),
            25,
            true,
          );
          const qtyTxt =
            num(it.qty) +
            ' ' +
            (it.unit || '') +
            (it.isBonus ? '' : '  ×  ' + num(it.price));
          h.row(qtyTxt, it.isBonus ? 'بونص' : num(it.total) + ' ج', 23, false);
          h.gap(2);
          if (i < items.length - 1) h.line('dotted');
        });
        h.gap(2);
        h.line('solid');
        const disc = Number(r.discount) || 0;
        if (disc > 0) {
          h.row('مجموع الأصناف:', num(r.subtotal) + ' ج', 24, false);
          h.row('الخصم:', '- ' + num(disc) + ' ج', 24, false);
          h.line('dotted');
        }
        h.row('الإجمالي:', num(r.net) + ' ج', 34, true);
        h.gap(2);
        h.line('dashed');
        const pays = r.payments || [];
        pays.forEach((p) =>
          h.row(
            h.iso('دفع ' + (p.method || '')),
            num(p.amount) + ' ج',
            24,
            false,
          ),
        );
        if (pays.length > 1) h.row('المدفوع:', num(r.paid) + ' ج', 24, true);
        if (!pays.length && Number(r.paid) > 0)
          h.row('المدفوع:', num(r.paid) + ' ج', 24, false);
        h.gap(2);
        if (Number(r.remaining) > 0)
          h.row('المتبقي:', num(r.remaining) + ' ج', 30, true);
        else h.center('تم السداد بالكامل', 26, true);
        if (r.notes) {
          h.gap(2);
          h.line('dashed');
          h.right('ملاحظات: ' + h.iso(r.notes), 22, false);
        }
        h.gap(2);
        h.line('dashed');
        if (r.receiver) h.right('المستلم: ' + h.iso(r.receiver), 24, true);
        h.contacts();
        h.gap(2);
        h.line('dotted');
        h.center('الاستبدال والاسترجاع', 23, true);
        h.center('متاح لمنتجات ' + h.iso('MR GENIUS') + ' فقط', 22, false);
        h.center('خلال ' + h.iso('14') + ' يومًا من تاريخ الفاتورة', 22, false);
        h.gap(6);
        h.line('dashed');
        h.center('شكراً لتعاملكم معنا', 26, true);
        state.y += 40;
        return finishCanvas(state);
      }

      function renderCollection(r, logo) {
        const state = makeCanvas(1100);
        const h = drawHelpers(state);
        h.drawLogo(logo);
        h.center(r.company || '', 28, true);
        h.gap(6);
        h.bar('فاتورة تحصيل', 28);
        h.row('رقم الفاتورة:', '#' + r.number, 28, true);
        h.row('التاريخ:', h.iso(r.date), 24, false);
        h.gap(2);
        h.line('dashed');
        h.right('العميل: ' + h.iso(r.customer), 28, true);
        if (r.phone) h.right('الهاتف: ' + h.iso(r.phone), 24, false);
        h.right('المندوب: ' + h.iso(r.employee), 24, false);
        h.gap(4);
        h.line('dashed');
        h.center('تم تحصيل مبلغ', 24, false);
        h.center(num(r.net) + ' جنيه', 42, true);
        h.gap(4);
        h.right(
          'تم الاستلام من: ' + h.iso(r.receivedFrom || r.customer || ''),

        if (pays.length === 1) {

        } else if (pays.length > 1) {
          h.line('dotted');
          pays.forEach((p) =>
            h.row(h.iso(p.method || 'دفع'), num(p.amount) + ' ج', 24, false),

        if (r.notes) {

          h.line('dashed');
          h.right('ملاحظات: ' + h.iso(r.notes), 22, false);
        }
        if (r.receiver) {
          h.gap(2);
          h.line('dashed');
          h.right('المستلم: ' + h.iso(r.receiver), 24, true);
        }
        h.contacts();
        h.gap(6);
        h.line('dashed');
        h.center('شكراً لتعاملكم معنا', 26, true);

      function renderStock(r, logo) {
        const items = r.items || [];
        const methods = r.methods || {};
        const s = r.salesSummary || {};
        const methodKeys = Object.keys(methods).filter((k) => methods[k] > 0);
        const state = makeCanvas(
          1400 + items.length * 90 + methodKeys.length * 50,
        );
        const h = drawHelpers(state);
        h.drawLogo(logo);
        h.center(r.company || '', 28, true);
        h.gap(6);
        h.bar('جرد العربية', 28);
        h.row('المندوب:', h.iso(r.rep || ''), 26, true);
        h.row('التاريخ:', h.iso(r.date), 24, false);
        h.gap(2);
        h.line('dashed');
        h.center('الأصناف', 24, true);
        h.gap(2);
        if (!items.length) {
          h.center('لا توجد أصناف', 22, false);
        } else {
          items.forEach((it, i) => {
            const title =
              (it.name || '') + (it.color ? ' (' + it.color + ')' : '');
            h.right(h.iso(i + 1 + '. ' + title), 24, true);
            const load =
              it.loaded != null
                ? it.loaded
                : it.opening != null
                  ? it.opening
                  : '—';
            const sold = it.sold != null ? it.sold : 0;
            const bal = it.balance != null ? it.balance : it.qty;
            h.row('حمولة ' + num(load), 'مبيع ' + num(sold), 22, false);
            h.row('المتبقي:', num(bal), 26, true);
            if (i < items.length - 1) h.line('dotted');
          });
        }
        h.gap(4);
        h.line('solid');
        h.center('ملخص النقدية اليوم', 24, true);
        h.gap(2);
        h.row('المبيعات:', num(s.salesTotal) + ' ج', 24, false);
        h.row('المحصّل من المبيعات:', num(s.paid) + ' ج', 24, false);
        h.row('التحصيلات:', num(s.collections) + ' ج', 24, false);
        h.row('إجمالي النقدية:', num(s.cashTotal) + ' ج', 28, true);
        if (methodKeys.length) {
          h.gap(2);
          h.line('dashed');
          h.center('حسب طريقة الدفع', 22, true);
          methodKeys.forEach((k) =>
            h.row(h.iso(k), num(methods[k]) + ' ج', 23, false),
          );
        }
        h.gap(6);
        h.line('dashed');
        h.center('تقرير جرد — يتحدث مع كل بيع', 20, false);
        state.y += 40;
        return finishCanvas(state);
      }

      // بيرجّع مصفوفة شرايح (كل شريحة Uint8Array) بدل بايتات مدمجة
      // rowsOverride: عدد أسطر الشريحة (RawBT بيستخدم شرايح أكبر)
      // skipPause: من غير علامة الاستراحة (مش محتاجينها مع RawBT)
      function toEscPos(img, rowsOverride, skipPause) {
        const W = img.W,
          H = img.H,
          d = img.data,
          bpr = W / 8;
        const parts = [new Uint8Array([0x1b, 0x40])]; // تهيئة ESC @

        // استراحة بعد التهيئة (للبلوتوث المباشر على أندرويد بس)
        if (IS_ANDROID && !skipPause) {
          parts.push(null);
        }

        const ROWS = rowsOverride || cfg().rows;
        for (let top = 0; top < H; top += ROWS) {
          const h = Math.min(ROWS, H - top);
          const buf = new Uint8Array(8 + bpr * h);
          buf.set([
            0x1d,
            0x76,
            0x30,
            0x00,
            bpr & 255,
            bpr >> 8,
            h & 255,
            h >> 8,
          ]);
          let p = 8;
          for (let yy = 0; yy < h; yy++) {
            for (let bx = 0; bx < bpr; bx++) {
              let b = 0;
              for (let bit = 0; bit < 8; bit++) {
                const i = ((top + yy) * W + bx * 8 + bit) * 4;
                if (d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11 < 185)
                  b |= 0x80 >> bit;
              }
              buf[p++] = b;
            }
          }
          parts.push(buf);
        }
        parts.push(new Uint8Array([0x1b, 0x64, 0x04])); // feed
        return parts;
      }

      function errText(e) {
        let name = (e && e.name) || typeof e;
        let msg = '';
        try {
          msg =
            (e && e.message) || (typeof e === 'string' ? e : JSON.stringify(e));
        } catch (x) {
          msg = String(e);
        }
        return '[' + name + '] ' + msg;
      }

      // ---------- الطباعة عبر RawBT (أندرويد) ----------
      function toBase64(parts) {
        const all = parts.filter(Boolean);
        const len = all.reduce((s, a) => s + a.length, 0);
        const out = new Uint8Array(len);
        let o = 0;
        all.forEach((a) => {
          out.set(a, o);
          o += a.length;
        });
        let bin = '';
        for (let i = 0; i < out.length; i += 0x8000) {
          bin += String.fromCharCode.apply(null, out.subarray(i, i + 0x8000));
        }
        return btoa(bin);
      }

      async function printRawBT() {
        if (!R) return;
        const btn = $('goBtn');
        btn.disabled = true;
        try {
          prog(null);
          st('جاري تجهيز الإيصال...');
          const logo = await logoPromise;
          const img = render(R, logo);
          const b64 = toBase64(toEscPos(img, 128, true));
          st('جاري فتح راو بي تي...');
          location.href =
            'intent:base64,' +
            b64 +
            '#Intent;scheme=rawbt;launchFlags=0x10000000;package=ru.a402d.rawbtprinter;end;';
          setTimeout(() => {
            st('✔ اتبعت للتطبيق. لو مفتحش اتأكد إنه منزّل.', 'ok');
            btn.textContent = '🖨 اطبع تاني عبر راو بي تي';
            btn.disabled = false;
          }, 1500);
        } catch (e) {
          st('❌ ' + errText(e), 'err');
          btn.disabled = false;
        }
      }

      // الزرار الكبير: أندرويد → RawBT ، باقي الأجهزة → بلوتوث مباشر (Bluefy)
      function run() {
        if (IS_ANDROID) return printRawBT();
        return runBluetooth();
      }

      async function runBluetooth() {
        if (!R) return;
        const btn = $('goBtn');
        btn.disabled = true;
        try {
          try {
            $('statusCard').scrollIntoView({
              behavior: 'smooth',
              block: 'center',
            });
          } catch (x) {}
          if (!ready()) await connectFlow();
          onCh();
          const C = cfg();
          prog(0);
          st('جاري تجهيز الإيصال...');
          const logo = await logoPromise;
          const img = render(R, logo);
          const parts = toEscPos(img);
          // نحسب الطول من الأجزاء الحقيقية بس (نتجاهل null)
          const totalLen = parts.reduce((s, a) => s + (a ? a.length : 0), 0);
          let done = 0;
          for (const p of parts) {
            if (p === null) {
              // استراحة بعد التهيئة على أندرويد
              await sleep(IS_ANDROID ? 120 : 30);
              continue;
            }
            await write(p, done, totalLen);
            done += p.length;
            if (C.sp) await sleep(C.sp);
          }
          ls(CH_KEY, String(idx));
          prog(100, true);
          st('✔ تمت الطباعة', 'ok');
          btn.textContent = '🖨 اطبع تاني';
        } catch (e) {
          prog(null);
          st(
            '❌ ' +
              errText(e) +
              ' | مرحلة: ' +
              ($('status').dataset.stage || '?'),
            'err',
          );
        } finally {
          btn.disabled = false;
        }
      }
      function altChannel() {
        if (chars.length < 2) return;
        idx = (idx + 1) % chars.length;
        $('chSel').value = idx;
        st(
          'اتغيّرت القناة لـ ' + (idx + 1) + '/' + chars.length + ' — بيطبع...',
        );
        runBluetooth();
      }
      async function showPreview() {
        if (!R) return;
        try {
          const logo = await logoPromise;
          $('logoInfo').textContent = LOGO_INFO;
          $('logoInfo').style.color = logo ? '#1e8449' : '#c0392b';
          $('preview').src = render(R, logo).url;
          $('previewWrap').style.display = '';
        } catch (e) {
          st('تعذر رسم المعاينة: ' + errText(e), 'err');
        }
      }
      function onPaper() {
        ls('tima_paper', $('paper').value);
        showPreview();
      }
      (function () {
        const p = ls('tima_paper');
        if (p) $('paper').value = p;
        loadCfg();
        showPreview();
        if (IS_ANDROID) {
          $('goBtn').textContent = '🖨 اطبع عبر راو بي تي';
          st('جاهز. اضغط "اطبع عبر راو بي تي" فوق.');
        }
      })();
    </script>
